name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-source:
    name: Windows source and standard-library tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64
      - name: Validate tracked source files
        run: python -B scripts/check_public_source.py
      - name: Run synthetic local-data regression tests
        run: python -B -m unittest discover -s scripts/local_data/tests -v
      - name: Run synthetic packaging regression tests
        env:
          RUN_DESKTOP_HARNESS: '0'
          PACKAGING_TEST_ROOT: ${{ runner.temp }}/douyin-live-insight-packaging-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -B -m unittest discover -s packaging/tests -p test_packaging.py -v
